# nginx site for wss://ws.nullchat.org
# Install as /etc/nginx/sites-available/nullchat-ws (symlinked into sites-enabled).
#
# Client addresses stay inside nginx: they key the per-address limits below,
# are never logged, and are never forwarded to the application.

limit_conn_zone $binary_remote_addr zone=wsconn:10m;
limit_req_zone $binary_remote_addr zone=wsreq:10m rate=10r/m;

server {
    server_name ws.nullchat.org;

    location /ws/ {
        limit_conn wsconn 5;
        limit_req zone=wsreq burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Fixed Host: the application treats only its onion hostname as Tor,
        # so clearnet requests always arrive as ws.nullchat.org.
        proxy_set_header Host ws.nullchat.org;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        return 444;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ws.nullchat.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.nullchat.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name ws.nullchat.org;
    return 301 https://$host$request_uri;
}

# Requests for any other hostname never reach the application.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
